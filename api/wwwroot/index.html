<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Solar Microgrid API</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1914;
      --muted: #6b6256;
      --line: #eadfcd;
      --paper: #fffaf2;
      --card: #ffffff;
      --sun: #f5ad00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, #ffe7a3 0, transparent 28rem),
        var(--paper);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mark span {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 0 6px #ffe7a3;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 44px;
      line-height: 1.05;
    }

    p {
      margin: 0;
      max-width: 38rem;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #e8f7ee;
      color: #146c36;
      font-size: 14px;
      font-weight: 700;
    }

    .status i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1f9d55;
    }

    a.card {
      display: block;
      margin-top: 36px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
    }

    a.card:hover { border-color: var(--sun); }

    a.card strong { display: block; margin-bottom: 6px; font-size: 18px; }

    a.card code {
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark"><span></span> Smart Solar Microgrid</div>
    <h1>API is running.</h1>
    <p>This server hosts the solar station, user, and reservation API. Open a route under /api to read or update data.</p>
    <div class="status"><i></i> Online</div>
    <a class="card" href="/api/stations">
      <strong>Active stations</strong>
      <code>GET /api/stations</code>
    </a>
  </main>
</body>
</html>
